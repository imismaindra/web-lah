name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality (Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint
        run: vendor/bin/pint --test

  test:
    name: Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, bcmath, fileinfo, gd
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Verify deployment secrets
        run: |
          if [ -z "${{ secrets.CPANEL_SSH_HOST }}" ] || [ -z "${{ secrets.CPANEL_SSH_USER }}" ] || [ -z "${{ secrets.CPANEL_SSH_KEY }}" ] || [ -z "${{ secrets.CPANEL_APP_PATH }}" ]; then
            echo "::error::Secret deployment belum lengkap (CPANEL_SSH_HOST, CPANEL_SSH_USER, CPANEL_SSH_KEY, CPANEL_APP_PATH)."
            exit 1
          fi

      - name: Deploy via OpenSSH
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
          PHP_BIN: ${{ secrets.CPANEL_PHP_BIN || 'php' }}
          COMPOSER_BIN: ${{ secrets.CPANEL_COMPOSER_BIN || 'composer' }}
        run: |
          set -euo pipefail

          KEY_FILE="$RUNNER_TEMP/cpanel_deploy_key"
          ASKPASS_FILE="$RUNNER_TEMP/cpanel_ssh_askpass"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null; rm -f "$KEY_FILE" "$ASKPASS_FILE"' EXIT

          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            cat > "$ASKPASS_FILE" <<'ASKPASS_SCRIPT'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          ASKPASS_SCRIPT
            chmod 700 "$ASKPASS_FILE"
            DISPLAY=:0 SSH_ASKPASS="$ASKPASS_FILE" SSH_ASKPASS_REQUIRE=force ssh-add "$KEY_FILE" </dev/null
          else
            ssh-add "$KEY_FILE"
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          REMOTE_ARGS=$(printf ' %q' "$APP_PATH" "$PHP_BIN" "$COMPOSER_BIN")

          ssh -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" \
            "bash -s --$REMOTE_ARGS" <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_PATH="$1"
          PHP_BIN="$2"
          COMPOSER_BIN="$3"

          cd "$APP_PATH"

          $PHP_BIN artisan down --retry=15 || true

          git fetch origin main
          git reset --hard origin/main

          $COMPOSER_BIN install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          $PHP_BIN artisan storage:link || true
          $PHP_BIN artisan migrate --force
          $PHP_BIN artisan optimize:clear
          $PHP_BIN artisan config:cache
          $PHP_BIN artisan route:cache
          $PHP_BIN artisan view:cache

          $PHP_BIN artisan up
          REMOTE_SCRIPT
